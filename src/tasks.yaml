tasks:
  - id: task_load
    description: "Carregar CSV de sensores."
    tool: LoadCSVTool
    params:
      path: ${INPUT_CSV}
    output: sensors.json

  - id: task_normalize
    description: "Normalizar unidades (°C, ppm, m/s) e validar ranges críticos."
    tool: NormalizeSensorsTool
    input: sensors.json
    output: normalized.json

  - id: task_lit
    description: "Buscar normas e artigos técnicos relevantes (NFPA, PIARC, ABNT, artigos científicos)."
    tool: FetchLiteratureTool
    input: normalized.json
    output: literature.json

  - id: task_web_scraper
    description: "Extrair resumos e metadados de relatórios oficiais a partir dos links recuperados."
    tool: WebScraperTool
    input: literature.json
    output: abstracts.json

  - id: task_predict
    description: "Rodar modelo fuzzy + ML para previsão de risco de incêndio e evolução da fumaça."
    tool: PredictFireTool
    input: normalized.json
    output: risk.json

  - id: task_report
    description: "Gerar Boletim Automático de Risco em formato Markdown."
    tool: CompileReportTool
    input:
      - normalized.json
      - literature.json
      - abstracts.json
      - risk.json
    params:
      output_path: ${REPORT_FILE}
    output: report.md
