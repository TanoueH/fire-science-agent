tasks:
  - id: task_load
    description: "Load virtual sensor data from CSV."
    tool: LoadCSVTool
    params:
      path: ${INPUT_CSV}
    output: sensors.json

  - id: task_normalize
    description: "Normalize sensor variables and validate the input structure."
    tool: NormalizeSensorsTool
    input: sensors.json
    output: normalized.json

  - id: task_predict
    description: "Run hybrid fuzzy--ML fire-risk estimation."
    tool: PredictFireTool
    input: normalized.json
    params:
      alpha: ${ALPHA}
    output: risk.json

  - id: task_report
    description: "Generate a monitoring-oriented fire-risk report in Markdown format."
    tool: CompileReportTool
    input:
      - normalized.json
      - risk.json
    params:
      output_path: ${REPORT_FILE}
    output: report.md