version: "1.0"

defaults:
  seed: ${SEED:-42}
  run_id: ${RUN_ID:-paper-run}

agents:
  curator:
    role: "Curator"
    description: "Ingests, validates, and normalizes virtual sensor data derived from FDS simulations."
    tools:
      - "LoadCSVTool"
      - "NormalizeSensorsTool"
    params:
      seed: ${SEED:-42}
      run_id: ${RUN_ID:-paper-run}

  researcher:
    role: "Researcher"
    description: "Provides contextual support for rule-base supervision and model-related information."
    tools:
      - "SupportContextTool"
    params:
      seed: ${SEED:-42}
      run_id: ${RUN_ID:-paper-run}

  analyst:
    role: "Analyst"
    description: "Runs hybrid fuzzy--ML inference for tunnel fire-risk estimation."
    tools:
      - "PredictFireTool"
    params:
      seed: ${SEED:-42}
      run_id: ${RUN_ID:-paper-run}

  reporter:
    role: "Reporter"
    description: "Compiles monitoring-oriented fire-risk outputs and summaries."
    tools:
      - "CompileReportTool"
    params:
      seed: ${SEED:-42}
      run_id: ${RUN_ID:-paper-run}